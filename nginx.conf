user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id","method":"$request_method","uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"user_agent":"$http_user_agent","referer":"$http_referer"}';

  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;

    location = /api/health {
      access_log off;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 200 '{"status":"ok","service":"yaman-portfolio","version":"1.0.0","runtime":"nginx"}';
    }

    location /_next/static/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|css|js|json|txt|webmanifest)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri.html $uri/ /index.html;
    }
  }
}
